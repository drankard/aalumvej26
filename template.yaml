AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Aalumvej26 - React + Lambda + DynamoDB

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 256
    # PermissionsBoundary is deliberately NOT set here. It is a valid Globals
    # property, but whether an Fn::If resolving to AWS::NoValue survives the
    # Globals merge can only be verified by a real deploy — sam build does not
    # run the Serverless transform locally. It is set per-function below instead,
    # which is plain resource-level behaviour.

Parameters:
  Stage:
    Type: String
    Default: prod
  CertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 for aalumvej26.dk (required for CloudFront)
    Default: ''
  DomainName:
    Type: String
    Default: aalumvej26.dk
  AlertEmail:
    Type: String
    Default: david@graveyard.dk
    Description: Email for content pipeline notifications and alarms
  EnableAccessLogs:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      CloudFront access logs (the only way to see AI crawler traffic). Driven by
      the ENABLE_ACCESS_LOGS repository variable via deploy.yml. It needs
      s3:PutBucketOwnershipControls and s3:PutLifecycleConfiguration, which the
      role gains automatically on the first deploy after the bootstrap.yaml sync
      step landed — so leave this off for that run, confirm the deploy is green,
      then set the variable to 'true'. Enabling it in the same run that first
      grants the permissions risks racing IAM's eventual consistency.
  EnableContentRebuild:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      The CodeBuild project the content pipeline triggers to republish the site.
      Off by default because creating it needs codebuild:CreateProject, which the
      live deploy role does not have, and that role carries an explicit Deny on
      modifying itself — so no CI path can grant it. These resources have been
      absent from the deployed stack since they were rolled back on 21 Jul, so
      'false' matches production reality rather than degrading it. Turn on once
      an account admin has applied bootstrap.yaml to the role.
  EnforceBoundary:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Attach the aalumvej26-boundary permissions boundary to every role in this
      stack. Driven by the ENFORCE_BOUNDARY repository variable via deploy.yml,
      so it is switched on from the GitHub UI. Requires the boundary policy to
      exist first: run the harden-role workflow with stage=create-boundary.
      Enabling it before the policy exists fails role creation and rolls back.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  WithAccessLogs: !Equals [!Ref EnableAccessLogs, 'true']
  WithBoundary: !Equals [!Ref EnforceBoundary, 'true']
  WithContentRebuild: !Equals [!Ref EnableContentRebuild, 'true']

Resources:
  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub aalumvej26-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      PermissionsBoundary: !If [WithBoundary, !Sub 'arn:aws:iam::${AWS::AccountId}:policy/aalumvej26-boundary', !Ref 'AWS::NoValue']
      FunctionName: !Sub aalumvej26-${Stage}
      CodeUri: backend/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          STAGE: !Ref Stage
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppTable
      Events:
        RpcEndpoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppApi
            Path: /rpc
            Method: POST

  AppApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # --- Content-driven site rebuild -----------------------------------------
  # The frontend is a static Astro build: content changes only reach the live
  # site via a rebuild. site-publish on sprintf (homelab decision 60) starts
  # this CodeBuild project after it writes Saga's posts to AppTable. The
  # buildspec just clones main and runs scripts/deploy-frontend.sh, the same
  # script deploy.yml uses, so build logic exists exactly once. The Bedrock
  # content pipeline that used to start it is removed (homelab decision 80).

  ContentRebuildRole:
    Type: AWS::IAM::Role
    Condition: WithContentRebuild
    Properties:
      RoleName: !Sub aalumvej26-content-rebuild-${Stage}
      # Explicit role, so the boundary must be declared here too — the Globals
      # entry only covers SAM-generated function roles.
      PermissionsBoundary: !If [WithBoundary, !Sub 'arn:aws:iam::${AWS::AccountId}:policy/aalumvej26-boundary', !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: content-rebuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/aalumvej26-content-rebuild-*
              - Sid: ReadStackOutputs
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aalumvej26/*
              - Sid: SyncFrontendBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::aalumvej26-frontend-${Stage}
                  - !Sub arn:aws:s3:::aalumvej26-frontend-${Stage}/*
              - Sid: InvalidateCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

  ContentRebuildProject:
    Type: AWS::CodeBuild::Project
    Condition: WithContentRebuild
    Properties:
      Name: !Sub aalumvej26-content-rebuild-${Stage}
      Description: Rebuild the static frontend from live content (triggered by the content pipeline)
      ServiceRole: !GetAtt ContentRebuildRole.Arn
      TimeoutInMinutes: 15
      ConcurrentBuildLimit: 1
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: STACK_NAME
            Value: aalumvej26
      Source:
        Type: NO_SOURCE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 20
            build:
              commands:
                - git clone --depth 1 https://github.com/drankard/aalumvej26.git repo
                - cd repo && ./scripts/deploy-frontend.sh

  ContentRebuildFailureRule:
    Type: AWS::Events::Rule
    Condition: WithContentRebuild
    Properties:
      Name: !Sub aalumvej26-content-rebuild-failed-${Stage}
      Description: Alert via SNS when a content-triggered site rebuild fails
      EventPattern:
        source:
          - aws.codebuild
        detail-type:
          - CodeBuild Build State Change
        detail:
          build-status:
            - FAILED
            - FAULT
            - STOPPED
            - TIMED_OUT
          project-name:
            - !Ref ContentRebuildProject
      State: ENABLED
      Targets:
        - Arn: !Ref ContentSummaryTopic
          Id: RebuildFailureSns
          InputTransformer:
            InputPathsMap:
              status: $.detail.build-status
              project: $.detail.project-name
            InputTemplate: '"[aalumvej26] Site rebuild <status> (CodeBuild project <project>). The live site was NOT updated — check the CodeBuild logs in the AWS console."'

  # EventBridge -> SNS requires an explicit topic policy (CloudWatch alarms do
  # not). The Owner/CloudWatch statements preserve the access the topic
  # already relies on, since a TopicPolicy replaces the default policy.
  ContentSummaryTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ContentSummaryTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OwnerAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - sns:Publish
              - sns:Subscribe
              - sns:Receive
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:ListSubscriptionsByTopic
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
            Resource: !Ref ContentSummaryTopic
          - Sid: CloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ContentSummaryTopic
          - Sid: EventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ContentSummaryTopic
            Condition: !If
              - WithContentRebuild
              - ArnEquals:
                  aws:SourceArn: !GetAtt ContentRebuildFailureRule.Arn
              - !Ref AWS::NoValue

  ContentSummaryTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub aalumvej26-content-summary-${Stage}
      DisplayName: Aalumvej26 Content Pipeline

  ContentSummarySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ContentSummaryTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasCertificate
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
          - !Sub www.${DomainName}
        Origins:
          - Id: S3Website
            DomainName: !Sub aalumvej26-frontend-${Stage}.s3-website-${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Website
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: eaab4381-ed33-4a86-88ca-d9558dc6cd63
        # No SPA fallback: the site is fully static multi-page (Astro), so
        # missing paths surface as real 404s (S3 website ErrorDocument serves
        # /404.html with a 404 status). This avoids soft-404s in search/AI
        # indexing.
        # Access logs are the only ground truth for AI crawler traffic: no answer
        # engine reports citations, and GPTBot/ClaudeBot/PerplexityBot fetches are
        # invisible to Search Console. Gated on EnableAccessLogs — see that
        # parameter for the deploy-role permissions this needs first.
        Logging: !If
          - WithAccessLogs
          - Bucket: !GetAtt LogsBucket.DomainName
            Prefix: cloudfront/
            IncludeCookies: false
          - !Ref AWS::NoValue
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3

  # CloudFront standard logging delivers via ACL, so this bucket keeps ACLs
  # enabled (BucketOwnerPreferred) while staying fully private to the public.
  # Setting OwnershipControls is precisely what the deploy role currently lacks
  # permission to do, hence the condition.
  LogsBucket:
    Type: AWS::S3::Bucket
    Condition: WithAccessLogs
    Properties:
      BucketName: !Sub aalumvej26-logs-${Stage}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aalumvej26-frontend-${Stage}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

Outputs:
  ApiUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendBucket:
    Value: !Ref FrontendBucket
  LogsBucket:
    Condition: WithAccessLogs
    Description: CloudFront access logs — source for AI crawler traffic analysis
    Value: !Ref LogsBucket
  TableName:
    Value: !Ref AppTable
  CloudFrontDomain:
    Condition: HasCertificate
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Condition: HasCertificate
    Value: !Ref CloudFrontDistribution
