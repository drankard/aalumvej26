AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  GitHub Actions OIDC provider and least-privilege deploy role for aalumvej26.
  NOTE: the live role predates this file and is not CloudFormation-managed
  (the aalumvej26-bootstrap stack is a ROLLBACK_COMPLETE corpse). This file is
  the source of truth for what the role SHOULD be; .github/workflows/
  harden-role.yml applies the scoped policy to the live role in stages.
  If the role ever needs recreation from scratch, deploy this template with
  admin credentials after deleting the dead stack and the existing role.

Parameters:
  GitHubOrg:
    Type: String
    Default: drankard
  GitHubRepo:
    Type: String
    Default: aalumvej26

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: aalumvej26-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationOnAppStacks
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource:
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/aalumvej26*/*
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Sid: CloudFormationTransform
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                Resource: arn:aws:cloudformation:*:aws:transform/*
              - Sid: SamArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:CreateBucket
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:GetBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default*
                  - arn:aws:s3:::aws-sam-cli-managed-default*/*
              - Sid: FrontendBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketWebsite
                  - s3:GetBucketWebsite
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketAcl
                  - s3:PutBucketTagging
                  # Required by the CloudFront access-logs bucket: standard
                  # logging delivers via ACL, so that bucket must re-enable
                  # object ACLs (BucketOwnerPreferred) and carry an expiry rule.
                  # Without these the stack update fails and rolls back the
                  # entire deploy, including the frontend publish.
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketOwnershipControls
                  - s3:PutLifecycleConfiguration
                  - s3:GetLifecycleConfiguration
                Resource:
                  - arn:aws:s3:::aalumvej26-*
                  - arn:aws:s3:::aalumvej26-*/*
              - Sid: DynamoDBAppTables
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource: !Sub arn:aws:dynamodb:*:${AWS::AccountId}:table/aalumvej26-*
              - Sid: LambdaAppFunctions
                Effect: Allow
                Action:
                  - lambda:*
                Resource:
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:function:aalumvej26-*
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - arn:aws:apigateway:*::/apis
                  - arn:aws:apigateway:*::/apis/*
                  - arn:aws:apigateway:*::/tags/*
              - Sid: EventsAppRules
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:EnableRule
                  - events:DisableRule
                  - events:TagResource
                  - events:UntagResource
                  - events:ListTagsForResource
                Resource: !Sub arn:aws:events:*:${AWS::AccountId}:rule/aalumvej26-*
              - Sid: SqsAppQueues
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:ListQueueTags
                Resource: !Sub arn:aws:sqs:*:${AWS::AccountId}:aalumvej26-*
              - Sid: CloudWatchAppAlarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub arn:aws:cloudwatch:*:${AWS::AccountId}:alarm:aalumvej26-*
              - Sid: SnsAppTopics
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:ListSubscriptionsByTopic
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                Resource: !Sub arn:aws:sns:*:${AWS::AccountId}:aalumvej26-*
              - Sid: SsmAppParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                Resource: !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/aalumvej26/*
              - Sid: CloudFrontForFrontend
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource: '*'
              - Sid: AcmReadForCloudFront
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                Resource: '*'
              # Creating or re-policying an app role is only safe if the result
              # carries the permissions boundary — otherwise this statement plus
              # iam:PassRole below is a complete escalation path (create role,
              # attach AdministratorAccess, pass it to a Lambda). The condition
              # makes the boundary mandatory rather than conventional.
              # PutRolePermissionsBoundary is in here too: without the condition
              # it could swap our ceiling for a permissive one (even an
              # AWS-managed policy) and reopen the hole this is meant to close.
              - Sid: IamManageAppRolesWithinBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aalumvej26-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/aalumvej26-boundary
              # Actions that cannot raise privilege, so no boundary condition.
              - Sid: IamReadAndCleanupAppRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aalumvej26-*
              # Managing the boundary policy document itself. Scoped to the
              # aalumvej26-* policy namespace so CI cannot mint arbitrary
              # managed policies to attach elsewhere.
              - Sid: IamManageBoundaryPolicy
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:policy/aalumvej26-*
              # Stripping a boundary would undo the control above, so deny it.
              # This is safe to apply at any stage and does not trap us: if a
              # boundary change ever breaks the app, recovery is to publish a
              # wider boundary version (iam:CreatePolicyVersion above), not to
              # detach the boundary. That keeps the escape hatch reachable from
              # CI alone while making removal impossible.
              - Sid: NeverRemoveBoundary
                Effect: Deny
                Action:
                  - iam:DeleteRolePermissionsBoundary
                Resource: '*'
              - Sid: IamPassAppRolesToLambda
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aalumvej26-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: CodeBuildManageAppProjects
                Effect: Allow
                Action:
                  - codebuild:CreateProject
                  - codebuild:UpdateProject
                  - codebuild:DeleteProject
                  - codebuild:BatchGetProjects
                Resource: !Sub arn:aws:codebuild:*:${AWS::AccountId}:project/aalumvej26-*
              - Sid: IamPassAppRolesToCodeBuild
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aalumvej26-*
                Condition:
                  StringEquals:
                    iam:PassedToService: codebuild.amazonaws.com
              # NeverModifySelf (Deny iam:* on this role) was removed deliberately.
              #
              # It never closed the escalation path it appeared to: the role could
              # already create an aalumvej26-* role, attach AdministratorAccess and
              # pass it to a Lambda. The boundary conditions above close that for
              # real. Meanwhile the self-Deny made every new resource type an admin
              # task, which is what silently broke two deploys in eight days — the
              # role's live policy drifted from this file and nothing could resync
              # it automatically.
              #
              # Self-modification is now permitted so deploy.yml can resync the
              # role on every push to main, making drift structurally impossible.
              # The control on that path is review: it requires a commit on main,
              # and the trust policy only admits refs/heads/main.
              #
              # To tighten further, split this into an unprivileged deploy role plus
              # a separate IAM-managing role assumable only from a workflow bound to
              # a protected GitHub Environment. See .github/policies/README.md.

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
