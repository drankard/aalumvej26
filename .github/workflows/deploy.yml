name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2

      # bootstrap.yaml is the source of truth for the deploy role, but nothing
      # used to apply it — it was pushed by hand via harden-role.yml. The live
      # role therefore drifted from the file and broke two deploys in eight days
      # (codebuild:CreateProject on 21 Jul, s3:PutBucketOwnershipControls on
      # 29 Jul), each time rolling back the stack and skipping the frontend
      # publish. Resyncing here, before SAM runs, makes that drift impossible:
      # a PR that needs a new permission carries it, and it is applied in the
      # same run that needs it.
      - name: Sync deploy-role policy from bootstrap.yaml
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          FLAGS=""
          if [ "${{ vars.ENFORCE_BOUNDARY }}" != "true" ]; then
            FLAGS="--without-boundary"
          fi
          python -m pip install --quiet pyyaml
          python .github/scripts/extract_role_policy.py "$ACCOUNT" $FLAGS > /tmp/policy.json
          aws iam put-role-policy \
            --role-name aalumvej26-github-deploy \
            --policy-name aalumvej26-scoped \
            --policy-document file:///tmp/policy.json
          echo "Deploy-role policy synced (boundary enforced: ${{ vars.ENFORCE_BOUNDARY || 'false' }})."
          # IAM is eventually consistent; give the new grants a moment to land
          # before CloudFormation starts asserting them.
          sleep 10

      - name: SAM build
        run: sam build --config-env ci

      - name: SAM deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --config-env ci \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "CertificateArn=arn:aws:acm:us-east-1:622327379339:certificate/d4006225-e2c7-49cb-80a2-b8073e8b10d0" \
              "EnforceBoundary=${{ vars.ENFORCE_BOUNDARY || 'false' }}" \
              "EnableAccessLogs=${{ vars.ENABLE_ACCESS_LOGS || 'false' }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same script the content-rebuild CodeBuild project runs — build logic
      # exists exactly once (scripts/deploy-frontend.sh).
      - name: Build and publish frontend
        run: ./scripts/deploy-frontend.sh
