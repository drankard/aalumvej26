name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2

      # NOTE: there is deliberately no step here that syncs the deploy role from
      # bootstrap.yaml. It was tried and it cannot work: the live role carries an
      # explicit Deny on iam:PutRolePolicy against itself, so it cannot rewrite
      # its own policy — the attempt fails with AccessDenied and takes the whole
      # deploy with it. That Deny is not in bootstrap.yaml and was not applied by
      # harden-role.yml (its finalize stage has never run), so the live role has
      # drifted by some other route and only an account admin can realign it.
      #
      # Until then, every capability needing a permission the role lacks stays
      # behind a default-off parameter: EnableContentRebuild, EnableAccessLogs,
      # EnforceBoundary. See bootstrap.yaml for the admin-side fix.
      - name: SAM build
        run: sam build --config-env ci

      - name: SAM deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --config-env ci \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "CertificateArn=arn:aws:acm:us-east-1:622327379339:certificate/d4006225-e2c7-49cb-80a2-b8073e8b10d0" \
              "EnforceBoundary=${{ vars.ENFORCE_BOUNDARY || 'false' }}" \
              "EnableAccessLogs=${{ vars.ENABLE_ACCESS_LOGS || 'true' }}" \
              "EnableContentRebuild=${{ vars.ENABLE_CONTENT_REBUILD || 'true' }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same script the content-rebuild CodeBuild project runs — build logic
      # exists exactly once (scripts/deploy-frontend.sh).
      - name: Build and publish frontend
        run: ./scripts/deploy-frontend.sh
