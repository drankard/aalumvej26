name: Harden deploy role (least privilege)

# Manual IAM operations for the deploy role.
#
# Everyday policy syncing is NOT here — deploy.yml applies bootstrap.yaml on
# every push to main, so the live role can no longer drift from the file. What
# remains are the operations that must happen out of band.
#
#   create-boundary   — create/update the aalumvej26-boundary managed policy from
#                       .github/policies/boundary.json, and attach it to the
#                       stack's existing roles. Run this BEFORE setting the
#                       ENFORCE_BOUNDARY repository variable to "true".
#   revert-boundary   — escape hatch. Widens the boundary to allow everything and
#                       drops the enforcing conditions from the deploy role, so a
#                       bad boundary cannot lock you out of deploying. Also unset
#                       the ENFORCE_BOUNDARY variable afterwards.
#   apply-scoped      — one-off manual policy push. Rarely needed now that
#                       deploy.yml syncs, but useful if main's deploy is broken
#                       in a way that needs the policy fixed first.
#   cleanup-dead-stack— delete the ROLLBACK_COMPLETE aalumvej26-bootstrap stack
#                       corpse (safe anytime; it manages nothing).
#
# The "finalize" stage was removed with the NeverModifySelf Deny it applied; see
# bootstrap.yaml for why that Deny closed nothing and cost a great deal.
#
# NOTE: the role's trust policy only admits repo:drankard/aalumvej26 on
# refs/heads/main, so this workflow must be on main to authenticate at all.
#
# WARNING — every stage below that calls iam:PutRolePolicy on the deploy role
# (apply-scoped, revert-boundary) CURRENTLY FAILS. The live role carries an
# explicit Deny on modifying itself:
#
#   AccessDenied: iam:PutRolePolicy on role aalumvej26-github-deploy
#   with an explicit deny in an identity-based policy
#
# That Deny is not in bootstrap.yaml and finalize has never run, so it arrived by
# some route outside this repo. Until an account admin removes it or applies
# bootstrap.yaml directly with admin credentials, no CI path can change this
# role, and create-boundary cannot work either (it needs iam:CreatePolicy, which
# the role does not have and cannot grant itself).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Hardening stage to run"
        type: choice
        options: [create-boundary, revert-boundary, apply-scoped, detach-managed, cleanup-dead-stack]
        required: true

jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ROLE_NAME: aalumvej26-github-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: apply-scoped
        if: inputs.stage == 'apply-scoped'
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          python .github/scripts/extract_role_policy.py "$ACCOUNT" --without-deny > /tmp/policy.json
          aws iam put-role-policy --role-name "$ROLE_NAME" \
            --policy-name aalumvej26-scoped \
            --policy-document file:///tmp/policy.json
          echo "Scoped policy applied (without self-Deny). Now run Deploy to verify, then stage detach-managed."

      - name: detach-managed
        if: inputs.stage == 'detach-managed'
        run: |
          for p in AWSCloudFormationFullAccess AmazonS3FullAccess AmazonDynamoDBFullAccess AWSLambda_FullAccess AmazonAPIGatewayAdministrator; do
            aws iam detach-role-policy --role-name "$ROLE_NAME" \
              --policy-arn "arn:aws:iam::aws:policy/$p" 2>/dev/null \
              && echo "detached $p" || echo "$p not attached (ok)"
          done
          echo "Managed policies detached. Now run Deploy to verify, then stage finalize."

      - name: create-boundary
        if: inputs.stage == 'create-boundary'
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ARN="arn:aws:iam::$ACCOUNT:policy/aalumvej26-boundary"
          DOC=file://.github/policies/boundary.json

          if aws iam get-policy --policy-arn "$ARN" >/dev/null 2>&1; then
            echo "Boundary exists — publishing a new default version."
            # IAM caps a managed policy at 5 versions; drop the non-default ones
            # first so repeated runs never wedge on the limit.
            for v in $(aws iam list-policy-versions --policy-arn "$ARN" \
                --query 'Versions[?IsDefaultVersion==`false`].VersionId' --output text); do
              aws iam delete-policy-version --policy-arn "$ARN" --version-id "$v" || true
            done
            aws iam create-policy-version --policy-arn "$ARN" \
              --policy-document "$DOC" --set-as-default >/dev/null
          else
            echo "Creating boundary policy."
            aws iam create-policy --policy-name aalumvej26-boundary \
              --policy-document "$DOC" \
              --description "Escalation ceiling for aalumvej26 CI-created roles" >/dev/null
          fi

          # Attach to the roles the stack already owns, so the enforcing
          # conditions are satisfiable the moment they are applied. Roles are
          # read from CloudFormation rather than iam:ListRoles, which cannot be
          # scoped to a resource prefix.
          ROLES=$(aws cloudformation describe-stack-resources --stack-name aalumvej26 \
            --query "StackResources[?ResourceType=='AWS::IAM::Role'].PhysicalResourceId" \
            --output text || true)
          if [ -z "$ROLES" ]; then
            echo "::warning::No IAM roles found in stack aalumvej26 — nothing to attach."
          fi
          for r in $ROLES; do
            aws iam put-role-permissions-boundary --role-name "$r" --permissions-boundary "$ARN"
            echo "boundary attached: $r"
          done

          echo ""
          echo "Boundary ready. Next: set repository variable ENFORCE_BOUNDARY=true"
          echo "(Settings > Secrets and variables > Actions > Variables), then re-run Deploy."

      - name: revert-boundary
        if: inputs.stage == 'revert-boundary'
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ARN="arn:aws:iam::$ACCOUNT:policy/aalumvej26-boundary"

          # Widen rather than detach: NeverRemoveBoundary denies
          # DeleteRolePermissionsBoundary by design, so this is the escape hatch
          # that stays reachable from CI with no CLI access.
          cat > /tmp/open-boundary.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Sid":"Reverted","Effect":"Allow","Action":"*","Resource":"*"}]}
          JSON
          for v in $(aws iam list-policy-versions --policy-arn "$ARN" \
              --query 'Versions[?IsDefaultVersion==`false`].VersionId' --output text); do
            aws iam delete-policy-version --policy-arn "$ARN" --version-id "$v" || true
          done
          aws iam create-policy-version --policy-arn "$ARN" \
            --policy-document file:///tmp/open-boundary.json --set-as-default >/dev/null
          echo "Boundary widened to allow-all (attachments left in place, and harmless)."

          python .github/scripts/extract_role_policy.py "$ACCOUNT" --without-boundary > /tmp/policy.json
          aws iam put-role-policy --role-name "$ROLE_NAME" \
            --policy-name aalumvej26-scoped \
            --policy-document file:///tmp/policy.json
          echo "Enforcing conditions removed from the deploy role."
          echo ""
          echo "Now unset the ENFORCE_BOUNDARY repository variable, or the next"
          echo "deploy will re-apply the conditions."

      - name: cleanup-dead-stack
        if: inputs.stage == 'cleanup-dead-stack'
        run: |
          aws cloudformation delete-stack --stack-name aalumvej26-bootstrap
          aws cloudformation wait stack-delete-complete --stack-name aalumvej26-bootstrap
          echo "Dead aalumvej26-bootstrap stack deleted."
