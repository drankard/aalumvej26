name: Bootstrap drift check

# bootstrap.yaml describes what the deploy role SHOULD be. Nothing applies it:
# the live role is not CloudFormation-managed, and it carries an explicit Deny on
# modifying itself, so CI cannot resync it either. Only an account admin can.
#
# That gap has broken three deploys:
#   21 Jul  codebuild:CreateProject   — added to the file 33h after the last sync
#   29 Jul  s3:PutBucketOwnershipControls — never granted anywhere
#   30 Jul  the resync attempt itself, blocked by the self-Deny
#
# Each time the stack rolled back and the frontend publish was skipped. The
# failure mode is silent at review time and only shows up in production, so this
# makes it loud in the PR instead.

on:
  pull_request:
    paths:
      - 'bootstrap.yaml'
      - '.github/policies/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Diff the permissions this PR expects
        id: diff
        run: |
          set -euo pipefail
          git show "origin/${{ github.base_ref }}:bootstrap.yaml" > /tmp/base.yaml || cp bootstrap.yaml /tmp/base.yaml
          python .github/scripts/diff_role_permissions.py /tmp/base.yaml bootstrap.yaml > /tmp/diff.md
          cat /tmp/diff.md
          # Non-empty means the PR expects permissions the live role will not have.
          if [ -s /tmp/diff.md ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Comment on the PR
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/diff.md', 'utf8');
            const marker = '<!-- bootstrap-drift -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.rest.issues.listComments({owner, repo, issue_number}))
              .data.find(c => c.body.includes(marker));
            const full = `${marker}\n${body}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body: full});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body: full});
            }
